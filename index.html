  <title>ファミリー管理</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f7f2;color:#263c33;font-family:system-ui,sans-serif}main{max-width:520px;margin:auto;padding:32px 20px 60px}header p{color:#60756b;font-size:14px}h1{font-size:28px;margin:8px 0}form{background:white;padding:24px;border-radius:22px;border:1px solid #e0e7dc;margin-top:24px}label,legend{font-weight:600;font-size:15px}input{font:inherit;color:inherit}input[type=date],input[type=text],input[type=url]{display:block;width:100%;min-width:0;padding:14px;margin:8px 0 22px;border:1px solid #bccdc2;border-radius:10px;font-size:16px}fieldset{border:0;padding:0;margin:0 0 22px}fieldset:disabled{opacity:.6}#fields{margin:0}legend{margin-bottom:10px}.choices{display:flex;gap:10px}.choice{flex:1;position:relative}.choice input{position:absolute;opacity:0}.choice span{display:block;padding:14px 8px;border:1px solid #bccdc2;border-radius:12px;text-align:center}.choice input:checked+span{background:#e1f1e6;border:2px solid #32724f;padding:13px 7px}.choice input:focus-visible+span{outline:3px solid #c39339}button{width:100%;padding:16px;border:0;border-radius:12px;background:#32724f;color:white;font:inherit;font-weight:bold;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#status{line-height:1.7;white-space:pre-wrap;padding:16px 0;margin:0;font-size:14px}small{font-weight:normal;color:#64786d}.note{font-size:13px;line-height:1.7;color:#64786d}
  .meal-card{background:white;border:1px solid #e0e7dc;border-radius:16px;padding:18px;margin:12px 0;overflow-wrap:anywhere}.meal-card h3{margin:8px 0 16px;font-size:18px}.meal-card p{margin:0}.meal-card a{display:inline-block;margin-top:14px;color:#32724f}.reuse{background:#e1f1e6;color:#263c33}#history{margin-top:36px}#history h2{font-size:23px}#historyStatus{font-size:14px;line-height:1.6}.history-tools{display:flex;gap:10px;align-items:center;margin-top:10px}.history-tools select{flex:1;min-width:0;font:inherit;padding:12px;border:1px solid #bccdc2;border-radius:10px;background:white}.history-tools button{width:auto;padding:12px 18px}button:focus-visible,a:focus-visible{outline:3px solid #c39339;outline-offset:3px}.app-tabs{display:flex;gap:10px;margin:24px 0}.app-tabs button{background:#e1f1e6;color:#263c33}.app-tabs button[aria-pressed=true]{background:#32724f;color:white}#todoMessage,#todoCount{font-size:14px;line-height:1.7}#todoFields{margin:0}.taskAction{margin-top:16px}.overdue{color:#a33a28;font-weight:bold}[hidden]{display:none!important}textarea{display:block;width:100%;font:inherit;padding:12px;margin:8px 0 22px;border:1px solid #bccdc2;border-radius:10px}#scheduleMonth{min-width:0;width:100%;font:inherit;padding:10px;border:1px solid #bccdc2;border-radius:10px}#calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:20px 0}#calendar>span{text-align:center;font-size:13px;padding:8px 0}#calendar button{padding:12px 0;min-height:44px;border-radius:8px;font-size:14px;background:white;color:#263c33;border:1px solid #e0e7dc}#calendar button[aria-pressed=true]{background:#32724f;color:white}#calendar button.today{border:2px solid #c39339}.app-tabs button{padding:14px 4px}#scheduleStatus,#scheduleMessage{font-size:14px;line-height:1.7}#scheduleFields{margin:0}</style>

<body>
<main>
  <header><p>家族のデジタル手帳</p><h1>今日の献立</h1><p>献立・やること・予定を、ひとつの手帳に。</p></header><nav class="app-tabs" aria-label="機能を選ぶ"><button id="mealTab" type="button" aria-pressed="true">🍽️ 献立</button><button id="todoTab" type="button" aria-pressed="false">✓ ToDo</button><button id="scheduleTab" type="button" aria-pressed="false">📅 予定</button></nav><div id="mealPanel">
  <p id="status" role="status" aria-live="polite">LINEのログイン状態を確認しています…</p>
  <form id="mealForm">
    <fieldset id="fields" disabled>
      <label for="date">日付</label><input id="date" type="date" required>
      <fieldset><legend>どこの献立？</legend><div class="choices">
        <label class="choice"><input type="radio" name="category" value="家庭" checked><span>🏠 家庭</span></label>
        <label class="choice"><input type="radio" name="category" value="保育園"><span>🐣 保育園</span></label>
      </div></fieldset>
      <label for="dish">料理名</label><input id="dish" type="text" maxlength="200" placeholder="例：カレーライス、サラダ" required>
      <label for="recipeUrl">レシピURL <small>任意</small></label><input id="recipeUrl" type="url" maxlength="2000" placeholder="https://…">
      <button id="save" type="submit">献立を保存</button>
    </fieldset>
  </form>
  <p class="note">保存先は家族のスプレッドシートです。LINEへの通知は送りません。</p>
<section id="history" hidden aria-labelledby="historyTitle"><h2 id="historyTitle">献立の履歴</h2><p class="note">過去の料理をタップして、料理名とURLを再利用できます。入力欄の日付は変わりません。</p><label for="historyFilter">区分で絞り込み</label><div class="history-tools"><select id="historyFilter"><option value="">すべて</option><option value="家庭">🏠 家庭</option><option value="保育園">🐣 保育園</option></select><button id="refreshHistory" type="button">更新</button></div><p id="historyStatus" role="status" aria-live="polite"></p><div id="historyList"></div><button id="moreHistory" type="button" hidden>もっと見る</button></section></div><section id="todoPanel" hidden aria-labelledby="todoHeading"><h2 id="todoHeading">家族のToDo</h2><p class="note">やることを追加して、終わったらタップ。期限はここで確認できます。</p><p id="todoMessage" role="status" aria-live="polite"></p><form id="todoForm"><fieldset id="todoFields" disabled><label for="task">やること</label><input id="task" type="text" maxlength="300" placeholder="例：保育園の書類を提出する" required><label for="due">期限 <small>任意</small></label><input id="due" type="date"><button type="submit" id="addTodo">タスクを追加</button></fieldset></form><div class="history-tools"><label for="todoFilter">表示</label><select id="todoFilter"><option value="未完了">未完了</option><option value="完了">完了済み</option></select><button type="button" id="refreshTodos">更新</button></div><p id="todoCount" role="status" aria-live="polite"></p><div id="todoList"></div><button id="moreTodos" type="button" hidden>もっと見る</button></section><section id="schedulePanel" hidden><p class="note">日付をタップして予定を確認・登録できます。時間や場所は備考にどうぞ。</p><div class="history-tools"><button id="prevMonth" type="button" aria-label="前の月">‹</button><label for="scheduleMonth">年月</label><input id="scheduleMonth" type="month" required><button id="nextMonth" type="button" aria-label="次の月">›</button></div><div class="history-tools"><button id="thisMonth" type="button">今月</button><button id="refreshSchedules" type="button">更新</button></div><p id="scheduleStatus" role="status" aria-live="polite"></p><div id="calendar" aria-label="予定カレンダー"></div><h2 id="selectedDayTitle"></h2><div id="dayEvents"></div><form id="scheduleForm"><fieldset id="scheduleFields" disabled><label for="scheduleDate">日付</label><input id="scheduleDate" type="date" required><label for="scheduleTitle">予定内容</label><input id="scheduleTitle" type="text" maxlength="300" placeholder="例：保育園の運動会" required><label for="scheduleNote">備考 <small>任意</small></label><textarea id="scheduleNote" maxlength="1000" rows="3" placeholder="例：10時から、公園に集合"></textarea><button type="submit">予定を追加</button></fieldset></form><p id="scheduleMessage" role="status" aria-live="polite"></p><h2>この月の予定</h2><div id="monthEvents"></div></section></main>
<script>
'use strict';
const LIFF_ID = '2011765255-ruAFo2xu';
const APP_URL = 'https://matsuoka1014.github.io/family-app/';
const API_URL = 'https://script.google.com/macros/s/AKfycbxaRyGYeobd2rqhcS0teJ0D5Bc6_iQDZ9K2POZYFcI5jFbUWmeL2h2RZUT7Om2z7zma/exec';
const form = document.getElementById('mealForm');
const fields = document.getElementById('fields');
const statusBox = document.getElementById('status');
const saveButton = document.getElementById('save');
const dateInput = document.getElementById('date');
const dishInput = document.getElementById('dish');
const urlInput = document.getElementById('recipeUrl');
let busy = false;
const parts = new Intl.DateTimeFormat('en-US', { timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit' }).formatToParts(new Date());
const dateParts = Object.fromEntries(parts.map(p => [p.type,p.value]));
dateInput.value = `${dateParts.year}-${dateParts.month}-${dateParts.day}`;

async function initialize() {
  try {
    if (!window.liff) throw new Error('LINEの読み込みに失敗しました。通信環境を確認して開き直してください。');
    await liff.init({liffId:LIFF_ID});
    if (!liff.isLoggedIn()) { liff.login({redirectUri:APP_URL}); return; }
    if (!liff.getIDToken()) throw new Error('認証情報を取得できません。LIFFのScopeでopenidを確認してください。');
    fields.disabled = false;
    loggedIn = true; todoFields.disabled = false; scheduleFields.disabled = false; if (!schedulePanel.hidden) loadSchedules(); if (!todoPanel.hidden) loadTodos();
    statusBox.textContent = '入力して「献立を保存」を押してください。';
    loadHistory();
  } catch (error) {
    statusBox.textContent = 'ログイン確認に失敗しました。\n' + error.message;
  }
}

form.addEventListener('submit', async event => {
  event.preventDefault();
  if (busy || !form.reportValidity()) return;
  const dish = dishInput.value.trim();
  const recipeUrl = urlInput.value.trim();
  if (!dish) { statusBox.textContent = '料理名を入力してください。'; return; }
  if (recipeUrl) {
    try { if (!['https:','http:'].includes(new URL(recipeUrl).protocol)) throw new Error(); }
    catch (_) { statusBox.textContent = 'レシピURLはhttp://またはhttps://で入力してください。'; return; }
  }
  const idToken = liff.getIDToken();
  if (!idToken) { statusBox.textContent = '認証の有効期限が切れました。画面を開き直してください。'; return; }
  const meal = {date:dateInput.value,category:form.querySelector('input[name=category]:checked').value,dish,recipeUrl};
  busy = true;
  fields.disabled = true;
  saveButton.textContent = '保存中…';
  statusBox.textContent = '保存しています。この画面でお待ちください。';
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 45000);
  try {
    // text/plainでプリフライトを避け、GASからのJSON応答を確認する。
    // no-corsや自動再送は使用しない。
    const response = await fetch(API_URL, {
      method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},
      credentials:'omit',redirect:'follow',signal:controller.signal,
      body:JSON.stringify({action:'addMeal',idToken,meal})
    });
    if (!response.ok) throw new Error('HTTP error');
    const data = await response.json();
    if (data.ok === false) {
      statusBox.textContent = '保存できませんでした。\n' + (data.error || '設定を確認してください。');
      return;
    }
    if (data.ok !== true || !data.result) throw new Error('Invalid response');
    statusBox.textContent = `保存しました！\n${meal.date} ／ ${meal.category} ／ ${meal.dish}`;
    dishInput.value = '';
    urlInput.value = '';
    loadHistory();
  } catch (_) {
    statusBox.textContent = '保存結果を確認できませんでした。すでに保存されている可能性があります。\nスプレッドシートの「献立」を確認し、行がなければ再度保存してください。';
  } finally {
    clearTimeout(timeout);
    busy = false;
    fields.disabled = false;
    saveButton.textContent = '献立を保存';
  }
});

const historySection = document.getElementById('history');
const historyStatus = document.getElementById('historyStatus');
const historyList = document.getElementById('historyList');
const historyFilter = document.getElementById('historyFilter');
const refreshHistory = document.getElementById('refreshHistory');
const moreHistory = document.getElementById('moreHistory');
let nextOffset = null;
let historyVersion = 0;
async function loadHistory(append = false) {
  const version = ++historyVersion;
  const offset = append ? nextOffset : 0;
  if (offset === null) return;
  historySection.hidden = false;
  historyStatus.textContent = '履歴を読み込んでいます…';
  moreHistory.disabled = true;
  refreshHistory.disabled = true;
  if (!append) { historyList.replaceChildren(); moreHistory.hidden = true; }
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 45000);
  try {
    const idToken = liff.getIDToken();
    if (!idToken) throw new Error('ログインの有効期限が切れました。画面を開き直してください。');
    const response = await fetch(API_URL, {
      method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},credentials:'omit',redirect:'follow',signal:controller.signal,
      body:JSON.stringify({action:'listMeals',idToken,offset,category:historyFilter.value})
    });
    if (!response.ok) throw new Error('通信に失敗しました。もう一度「更新」を押してください。');
    const data = await response.json();
    if (version !== historyVersion) return;
    if (!data.ok) throw new Error(data.error || '履歴を取得できませんでした。');
    if (!data.result || !Array.isArray(data.result.meals)) throw new Error('履歴の形式を確認できません。');
    for (const meal of data.result.meals) {
      const card = document.createElement('article'); card.className = 'meal-card';
      const meta = document.createElement('p'); meta.className = 'note'; meta.textContent = meal.date + ' ／ ' + meal.category;
      const title = document.createElement('h3'); title.textContent = meal.dish;
      const reuse = document.createElement('button'); reuse.type = 'button'; reuse.className = 'reuse'; reuse.textContent = 'この料理を入力';
      reuse.addEventListener('click', () => {
        if (busy || fields.disabled) return;
        if ((dishInput.value.trim() || urlInput.value.trim()) && !window.confirm('入力中の料理名とURLを、この料理に置き換えますか？')) return;
        dishInput.value = meal.dish;
        urlInput.value = meal.recipeUrl || '';
        for (const radio of form.querySelectorAll('input[name=category]')) radio.checked = radio.value === meal.category;
        statusBox.textContent = '料理を入力しました。日付を確認して「献立を保存」を押してください。';
        form.scrollIntoView({behavior:'smooth',block:'start'});
        dishInput.focus({preventScroll:true});
      });
      card.append(meta,title,reuse);
      try {
        const url = new URL(meal.recipeUrl);
        if (['http:','https:'].includes(url.protocol)) {
          const link = document.createElement('a'); link.href = url.href; link.textContent = 'レシピを見る ↗'; link.target = '_blank'; link.rel = 'noopener noreferrer'; card.append(link);
        }
      } catch (_) {}
      historyList.append(card);
    }
    nextOffset = data.result.nextOffset;
    moreHistory.hidden = nextOffset === null;
    historyStatus.textContent = historyList.children.length ? historyList.children.length + '件を表示（日付の新しい順）' : 'この区分の献立はまだありません。';
  } catch (error) {
    if (version === historyVersion) historyStatus.textContent = '履歴を読み込めませんでした。' + (error.name === 'AbortError' ? '時間をおいて更新してください。' : error.message);
  } finally {
    clearTimeout(timer);
    if (version === historyVersion) { moreHistory.disabled = false; refreshHistory.disabled = false; }
  }
}
historyFilter.addEventListener('change', () => loadHistory());
refreshHistory.addEventListener('click', () => loadHistory());
moreHistory.addEventListener('click', () => loadHistory(true));


const todoPanel = document.getElementById('todoPanel');
const todoFields = document.getElementById('todoFields');
const todoForm = document.getElementById('todoForm');
const todoMessage = document.getElementById('todoMessage');
const todoList = document.getElementById('todoList');
const todoFilter = document.getElementById('todoFilter');
const todoCount = document.getElementById('todoCount');
const taskInput = document.getElementById('task');
const dueInput = document.getElementById('due');
const moreTodos = document.getElementById('moreTodos');
const refreshTodos = document.getElementById('refreshTodos');
let todoBusy = false, todoNext = null, todoVersion = 0, pendingTodo = null, loggedIn = false;
function showPanel(name) {
  document.getElementById('mealPanel').hidden = name !== 'meal';
  todoPanel.hidden = name !== 'todo'; schedulePanel.hidden = name !== 'schedule'; document.getElementById('scheduleTab').setAttribute('aria-pressed',String(name === 'schedule')); if(name === 'schedule' && loggedIn) loadSchedules();
  document.getElementById('mealTab').setAttribute('aria-pressed',String(name === 'meal'));
  document.getElementById('todoTab').setAttribute('aria-pressed',String(name === 'todo'));
  document.querySelector('h1').textContent = name === 'schedule' ? '家族の予定' : name === 'todo' ? '家族のToDo' : '今日の献立';
  if (name === 'todo' && loggedIn) loadTodos();
}
document.getElementById('mealTab').addEventListener('click',()=>showPanel('meal'));
document.getElementById('todoTab').addEventListener('click',()=>showPanel('todo'));
async function todoRequest(action, params = {}) {
  const idToken = liff.getIDToken();
  if (!idToken) throw new Error('ログインの有効期限が切れました。画面を開き直してください。');
  const controller = new AbortController();
  const timeout = setTimeout(()=>controller.abort(),45000);
  try {
    const response = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},credentials:'omit',redirect:'follow',signal:controller.signal,body:JSON.stringify({...params,action,idToken})});
    if (!response.ok) throw new Error('通信エラー');
    const data = await response.json();
    if (data.ok !== true) throw new Error(data.error || '操作できませんでした。');
    return data.result;
  } finally {clearTimeout(timeout);}
}
function taskDateLabel(task) {
  if (!task.due) return '期限なし';
  const today = new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date());
  const flag = task.status === '完了' ? '' : task.due < today ? ' ・期限切れ' : task.due === today ? ' ・今日まで' : '';
  return '期限：' + task.due + flag;
}
async function loadTodos(append = false) {
  if (!loggedIn) return;
  const version = ++todoVersion;
  const offset = append ? todoNext : 0;
  if (offset === null) return;
  todoCount.textContent = 'タスクを読み込んでいます…';
  refreshTodos.disabled = true; moreTodos.disabled = true;
  if (!append) { todoList.replaceChildren(); moreTodos.hidden = true; }
  try {
    const result = await todoRequest('listTodos',{status:todoFilter.value,offset});
    if (version !== todoVersion) return;
    for (const task of result.tasks) {
      const card = document.createElement('article'); card.className = 'meal-card';
      const title = document.createElement('h3'); title.textContent = task.task;
      const due = document.createElement('p'); due.className = 'note'; due.textContent = taskDateLabel(task);
      if (due.textContent.includes('期限切れ')) due.classList.add('overdue');
      const button = document.createElement('button'); button.type = 'button'; button.className = 'taskAction';
      button.textContent = task.status === '完了' ? '未完了に戻す' : '✓ 完了にする';
      button.disabled = todoBusy;
      button.addEventListener('click',async()=>{
        if (todoBusy) return;
        todoBusy = true; lockTodos(true); todoVersion++;
        const targetStatus = task.status === '完了' ? '未完了' : '完了';
        todoMessage.textContent = '更新しています…';
        try {
          await todoRequest('setTodoStatus',{id:task.id,status:targetStatus});
          todoMessage.textContent = targetStatus === '完了' ? '完了にしました。完了済み一覧から戻せます。' : '未完了に戻しました。';
          await loadTodos();
        } catch(error) {
          todoMessage.textContent = '結果を確認できませんでした。「更新」で状態を確認してください。 ' + error.message;
        } finally {todoBusy = false; lockTodos(false);}
      });
      card.append(title,due,button); todoList.append(card);
    }
    todoNext = result.nextOffset;
    moreTodos.hidden = todoNext === null;
    todoCount.textContent = result.total ? todoFilter.value + '：' + result.total + '件（期限の近い順）' : todoFilter.value === '未完了' ? '未完了のタスクはありません。' : '完了済みのタスクはありません。';
  } catch(error) { if (version === todoVersion) todoCount.textContent = '取得できませんでした。 ' + error.message; }
  finally { if(version === todoVersion) {refreshTodos.disabled = todoBusy; moreTodos.disabled = todoBusy;} }
}
function lockTodos(value) {
  todoFields.disabled = value || !loggedIn; todoFilter.disabled = value; refreshTodos.disabled = value; moreTodos.disabled = value;
  for (const button of todoList.querySelectorAll('button')) button.disabled = value;
}
todoForm.addEventListener('submit',async event=>{
  event.preventDefault(); if(todoBusy || !todoForm.reportValidity()) return;
  const task = taskInput.value.trim(), due = dueInput.value;
  if(!task) {todoMessage.textContent = 'やることを入力してください。';return;}
  const signature = JSON.stringify({task,due});
  if(!pendingTodo || pendingTodo.signature !== signature) pendingTodo = {signature,id:crypto.randomUUID()};
  todoBusy = true; lockTodos(true); todoVersion++;
  todoMessage.textContent = '追加しています…';
  try {
    await todoRequest('addTodo',{id:pendingTodo.id,task,due});
    pendingTodo = null; taskInput.value = ''; dueInput.value = ''; todoFilter.value = '未完了';
    todoMessage.textContent = 'タスクを追加しました。';
    await loadTodos();
  } catch(error) {
    todoMessage.textContent = '追加結果を確認できませんでした。「更新」で確認してください。同じ内容のまま再度追加しても重複しません。 ' + error.message;
  } finally {todoBusy = false; lockTodos(false);}
});
todoFilter.addEventListener('change',()=>loadTodos());
refreshTodos.addEventListener('click',()=>loadTodos());
moreTodos.addEventListener('click',()=>loadTodos(true));


const schedulePanel = document.getElementById('schedulePanel');
const scheduleFields = document.getElementById('scheduleFields');
const scheduleMonth = document.getElementById('scheduleMonth');
const scheduleDate = document.getElementById('scheduleDate');
const scheduleTitle = document.getElementById('scheduleTitle');
const scheduleNote = document.getElementById('scheduleNote');
const scheduleStatus = document.getElementById('scheduleStatus');
const scheduleMessage = document.getElementById('scheduleMessage');
let scheduleEvents = [], scheduleVersion = 0, scheduleBusy = false, pendingSchedule = null;
const todaySchedule = dateInput.value;
scheduleMonth.value = todaySchedule.slice(0,7); scheduleDate.value = todaySchedule;
function eventCard(event) {
  const card = document.createElement('article'); card.className = 'meal-card';
  const date = document.createElement('p'); date.className = 'note'; date.textContent = event.date;
  const title = document.createElement('h3'); title.textContent = event.title;
  const note = document.createElement('p'); note.style.whiteSpace = 'pre-wrap'; note.textContent = event.note;
  card.append(date,title,note); return card;
}
function renderScheduleDay() {
  const day = scheduleDate.value;
  document.getElementById('selectedDayTitle').textContent = day + ' の予定';
  const list = document.getElementById('dayEvents'); list.replaceChildren();
  const events = scheduleEvents.filter(e=>e.date===day);
  if (!events.length) {const p=document.createElement('p');p.className='note';p.textContent='この日の予定はありません。';list.append(p);}
  events.forEach(e=>list.append(eventCard(e)));
  for(const button of document.querySelectorAll('#calendar button')) button.setAttribute('aria-pressed',String(button.dataset.date===day));
}
function renderSchedules() {
  const calendar = document.getElementById('calendar'); calendar.replaceChildren();
  const [year,month] = scheduleMonth.value.split('-').map(Number);
  for (const label of ['日','月','火','水','木','金','土']) {const el=document.createElement('span');el.textContent=label;calendar.append(el);}
  const first = new Date(year,month-1,1).getDay(), days = new Date(year,month,0).getDate();
  for(let i=0;i<first;i++) calendar.append(document.createElement('span'));
  for(let d=1;d<=days;d++) {
    const date = scheduleMonth.value+'-'+String(d).padStart(2,'0');
    const count = scheduleEvents.filter(e=>e.date===date).length;
    const button=document.createElement('button');button.type='button';button.dataset.date=date;
    button.textContent=String(d)+(count?' •':'');button.setAttribute('aria-label',date+'、予定'+count+'件');
    if(date===todaySchedule) button.classList.add('today');
    button.addEventListener('click',()=>{if(scheduleBusy)return;scheduleDate.value=date;renderScheduleDay();});calendar.append(button);
  }
  const list=document.getElementById('monthEvents');list.replaceChildren();
  if(!scheduleEvents.length) {const p=document.createElement('p');p.className='note';p.textContent='この月の予定はありません。';list.append(p);}
  scheduleEvents.forEach(e=>list.append(eventCard(e)));renderScheduleDay();
}
async function loadSchedules() {
  if(!loggedIn || !scheduleMonth.value) return;
  const version=++scheduleVersion, month=scheduleMonth.value;
  scheduleStatus.textContent='予定を読み込んでいます…';
  document.getElementById('calendar').replaceChildren(); document.getElementById('dayEvents').replaceChildren(); document.getElementById('monthEvents').replaceChildren();
  try {
    const result=await todoRequest('listSchedules',{month});
    if(version!==scheduleVersion)return;
    if(!result || !Array.isArray(result.events))throw new Error('予定を確認できません。');
    scheduleEvents=result.events;renderSchedules();scheduleStatus.textContent=month.replace('-','年')+'月 ／ '+scheduleEvents.length+'件（• は予定のある日）';
  } catch(error) {if(version===scheduleVersion){scheduleEvents=[];scheduleStatus.textContent='読み込めませんでした。「更新」を押してください。 '+error.message;}}
}
function selectMonth(month) {
  scheduleMonth.value=month;
  if(scheduleDate.value.slice(0,7)!==month) scheduleDate.value=month===todaySchedule.slice(0,7)?todaySchedule:month+'-01';
  loadSchedules();
}
function shiftMonth(step) {
  const [y,m]=scheduleMonth.value.split('-').map(Number); const next=new Date(y,m-1+step,1);
  if(next.getFullYear()<1000 || next.getFullYear()>9999)return;
  selectMonth(next.getFullYear()+'-'+String(next.getMonth()+1).padStart(2,'0'));
}
document.getElementById('scheduleTab').addEventListener('click',()=>showPanel('schedule'));
document.getElementById('prevMonth').addEventListener('click',()=>shiftMonth(-1));
document.getElementById('nextMonth').addEventListener('click',()=>shiftMonth(1));
document.getElementById('thisMonth').addEventListener('click',()=>selectMonth(todaySchedule.slice(0,7)));
document.getElementById('refreshSchedules').addEventListener('click',()=>loadSchedules());
scheduleMonth.addEventListener('change',()=>{if(scheduleMonth.value)selectMonth(scheduleMonth.value);});
scheduleDate.addEventListener('change',()=>{if(!scheduleDate.value)return;if(scheduleDate.value.slice(0,7)!==scheduleMonth.value)selectMonth(scheduleDate.value.slice(0,7));else renderScheduleDay();});
document.getElementById('scheduleForm').addEventListener('submit',async event=>{
  event.preventDefault();if(scheduleBusy || !event.target.reportValidity())return;
  const data={date:scheduleDate.value,title:scheduleTitle.value.trim(),note:scheduleNote.value.trim()};
  if(!data.title){scheduleMessage.textContent='予定内容を入力してください。';return;}
  const signature=JSON.stringify(data);
  if(!pendingSchedule || pendingSchedule.signature!==signature)pendingSchedule={signature,id:crypto.randomUUID()};
  scheduleBusy=true;scheduleFields.disabled=true;
  for(const el of schedulePanel.querySelectorAll('.history-tools button,.history-tools input'))el.disabled=true;
  scheduleMessage.textContent='保存しています…';
  try {
    await todoRequest('addSchedule',{...data,id:pendingSchedule.id});pendingSchedule=null;
    scheduleTitle.value='';scheduleNote.value='';scheduleMonth.value=data.date.slice(0,7);
    scheduleMessage.textContent='予定を追加しました。';await loadSchedules();
  } catch(error) {scheduleMessage.textContent='結果を確認できませんでした。「更新」で確認してください。この画面で同じ内容を再送しても重複しません。 '+error.message;}
  finally {scheduleBusy=false;scheduleFields.disabled=!loggedIn;for(const el of schedulePanel.querySelectorAll('.history-tools button,.history-tools input'))el.disabled=false;}
});

initialize();
</script>
</body>
</html>
